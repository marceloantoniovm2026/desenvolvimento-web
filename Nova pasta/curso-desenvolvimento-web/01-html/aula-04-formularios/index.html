<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Formulário
        </title>
    </head>
    <body>
        <h1>
            Contato
        </h1>
        <form method="get">
            <p>
                <label for="nome">
                    Nome
                </label>
                <input id="nome" name="nome" required maxlength="100">
            </p>
            <p>
                <label for="email">
                    E-mail
                </label>
                <input id="email" name="email" type="email" required>
            </p>
            <button type="submit">
                Enviar
            </button>
        </form>
    </body>
</html>
